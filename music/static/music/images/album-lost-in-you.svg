<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="stageSpotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#7e22ce" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </linearGradient>
    <filter id="haze">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Theater/Concert Stage Background -->
  <rect width="400" height="400" fill="#090514"/>

  <!-- Ambient Light Cone -->
  <polygon points="200,0 80,400 320,400" fill="url(#lightCone)" filter="url(#haze)"/>

  <!-- Center Glowing Spot -->
  <circle cx="200" cy="180" r="140" fill="url(#stageSpotlight)"/>
  <circle cx="200" cy="170" r="50" fill="#fef08a" filter="url(#haze)" opacity="0.6"/>

  <!-- Atmospheric Light Particles / Dust Motes -->
  <g fill="#fef08a" opacity="0.65" filter="url(#haze)">
    <circle cx="170" cy="120" r="2.5"/>
    <circle cx="230" cy="140" r="2"/>
    <circle cx="150" cy="190" r="3"/>
    <circle cx="240" cy="200" r="2"/>
    <circle cx="190" cy="100" r="1.5"/>
    <circle cx="210" cy="240" r="2.5"/>
  </g>

  <!-- Performer Silhouette Standing in Spotlight -->
  <g fill="#07030d">
    <!-- Head -->
    <ellipse cx="200" cy="185" rx="22" ry="26"/>
    <!-- Hair / Curls -->
    <path d="M178,185 C176,160 224,160 222,185 C226,170 215,160 200,160 C185,160 174,170 178,185 Z"/>
    <!-- Neck -->
    <rect x="194" y="206" width="12" height="16" rx="3"/>
    <!-- Shoulders & Torso -->
    <path d="M155,235 C170,218 230,218 245,235 L260,330 C240,340 160,340 140,330 Z"/>
    <!-- Jacket collar / contour -->
    <path d="M175,225 L200,265 L225,225" stroke="#1c102a" stroke-width="3" fill="none"/>
    <!-- Microphone in Hand / Mic Stand -->
    <path d="M192,230 L188,270 L198,275 L202,235 Z" fill="#07030d"/>
    <ellipse cx="190" cy="225" rx="6" ry="8" fill="#2d1b42"/>
    <rect x="189" y="275" width="3" height="125" fill="#12081f"/>
    <!-- Bottom stage fog / rim -->
    <path d="M0,360 Q200,340 400,360 L400,400 L0,400 Z" fill="#05020a"/>
  </g>

  <!-- Golden Rim Light around silhouette edges -->
  <path d="M178,182 C178,162 222,162 222,182" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.6"/>
  <path d="M156,236 C168,222 190,219 200,219 C210,219 232,222 244,236" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.7"/>
</svg>
