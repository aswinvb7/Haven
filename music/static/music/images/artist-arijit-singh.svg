<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="arijitBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="60%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Background glow -->
    <rect width="200" height="200" fill="url(#arijitBg)"/>
    <!-- Stage spotlights -->
    <circle cx="60" cy="50" r="50" fill="#38bdf8" opacity="0.3"/>
    <circle cx="150" cy="70" r="40" fill="#0284c7" opacity="0.4"/>
    <!-- Head & Hair/Turban/Beard Silhouette -->
    <!-- Torso -->
    <path d="M40,210 C45,155 80,145 100,145 C120,145 155,155 160,210 Z" fill="#0f172a"/>
    <path d="M70,165 L100,195 L130,165" stroke="#0284c7" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Neck -->
    <rect x="90" y="115" width="20" height="35" fill="#f1c27d"/>
    <!-- Head -->
    <ellipse cx="100" cy="95" rx="30" ry="34" fill="#e0a96d"/>
    <!-- Hair & Beard -->
    <path d="M68,90 C68,55 132,55 132,90 C132,65 125,50 100,50 C75,50 68,65 68,90 Z" fill="#1e1e24"/>
    <!-- Beard and Moustache -->
    <path d="M70,95 C70,135 130,135 130,95 C125,115 118,125 100,125 C82,125 75,115 70,95 Z" fill="#1e1e24"/>
    <path d="M85,102 Q100,108 115,102 Q100,112 85,102 Z" fill="#1e1e24"/>
    <!-- Glasses -->
    <rect x="76" y="82" width="20" height="14" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="104" y="82" width="20" height="14" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="96" y1="88" x2="104" y2="88" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Microphone in hand -->
    <g transform="translate(62, 115) rotate(-25)">
      <rect x="15" y="10" width="10" height="32" rx="4" fill="#334155"/>
      <ellipse cx="20" cy="8" rx="8" ry="11" fill="#94a3b8"/>
      <ellipse cx="20" cy="8" rx="6" ry="9" fill="#cbd5e1" opacity="0.7"/>
    </g>
  </g>
</svg>
