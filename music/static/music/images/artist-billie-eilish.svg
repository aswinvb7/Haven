<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="billieBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <clipPath id="billieClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#billieClip)">
    <rect width="200" height="200" fill="url(#billieBg)"/>
    <!-- Neon green ambient hazy spots -->
    <circle cx="45" cy="45" r="35" fill="#10b981" opacity="0.3"/>
    <circle cx="160" cy="50" r="25" fill="#34d399" opacity="0.25"/>

    <!-- Oversized black streetwear hoodie -->
    <path d="M35,210 C40,150 70,140 100,140 C130,140 160,150 165,210 Z" fill="#09090b"/>
    <!-- Silver chains around neck -->
    <path d="M80,145 Q100,165 120,145" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M75,150 Q100,175 125,150" stroke="#cbd5e1" stroke-width="2" fill="none"/>

    <!-- Neck -->
    <rect x="91" y="115" width="18" height="30" fill="#ccfbf1"/>
    <!-- Face -->
    <ellipse cx="100" cy="96" rx="27" ry="30" fill="#e0e7ff"/>
    <!-- Moody, piercing eyes with dark lashes -->
    <ellipse cx="88" cy="92" rx="5" ry="3" fill="#0d9488"/>
    <circle cx="88" cy="92" r="2" fill="#042f2e"/>
    <ellipse cx="112" cy="92" rx="5" ry="3" fill="#0d9488"/>
    <circle cx="112" cy="92" r="2" fill="#042f2e"/>
    <!-- Eyelids / sleepy aesthetic -->
    <path d="M82,90 Q88,88 94,91" stroke="#042f2e" stroke-width="2" fill="none"/>
    <path d="M106,91 Q112,88 118,90" stroke="#042f2e" stroke-width="2" fill="none"/>
    <!-- Neutral lips -->
    <ellipse cx="100" cy="110" rx="6" ry="3" fill="#f43f5e" opacity="0.8"/>

    <!-- Hair: Jet black lower lengths and iconic neon lime green roots -->
    <!-- Jet black lower hair -->
    <path d="M58,95 C45,130 52,185 65,200 C55,160 52,120 60,90 Z" fill="#09090b"/>
    <path d="M142,95 C155,130 148,185 135,200 C145,160 148,120 140,90 Z" fill="#09090b"/>
    <path d="M60,85 C60,45 140,45 140,85 C132,65 125,50 100,50 C75,50 68,65 60,85 Z" fill="#09090b"/>

    <!-- Signature Neon Lime Green Roots & Crown -->
    <path d="M64,72 C66,42 134,42 136,72 C125,55 115,46 100,46 C85,46 75,55 64,72 Z" fill="#22c55e"/>
    <path d="M68,68 Q80,78 86,65 Q95,78 100,60 Q105,78 114,65 Q120,78 132,68 Q125,52 100,52 Q75,52 68,68 Z" fill="#4ade80"/>
    <path d="M82,65 L86,85 L90,68 L96,88 L102,68 L108,86 L112,65" stroke="#22c55e" stroke-width="2" fill="none"/>
  </g>
</svg>
