<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow-1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg-grad-1)" />
  <circle cx="60" cy="60" r="58" fill="url(#glow-1)" />
  <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  <!-- Headphones Icon Motif -->
  <g filter="url(#shadow-1)">
    <path d="M36 62 A24 24 0 0 1 84 62" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Left ear cup -->
    <rect x="30" y="56" width="12" height="22" rx="6" fill="#ffffff" />
    <rect x="33" y="60" width="6" height="14" rx="3" fill="#06b6d4" />
    <!-- Right ear cup -->
    <rect x="78" y="56" width="12" height="22" rx="6" fill="#ffffff" />
    <rect x="81" y="60" width="6" height="14" rx="3" fill="#06b6d4" />
    <!-- Pulse Soundwave at center -->
    <line x1="50" y1="68" x2="50" y2="76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="64" x2="55" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="60" x2="60" y2="84" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="65" y1="64" x2="65" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="70" y1="68" x2="70" y2="76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
