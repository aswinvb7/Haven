    <rect x="42" y="42" width="7" height="39" rx="3.5" fill="url(#bar-grad)" />
    <rect x="54" y="32" width="7" height="49" rx="3.5" fill="#ffffff" />
    <rect x="66" y="46" width="7" height="35" rx="3.5" fill="url(#bar-grad)" />
    <rect x="78" y="36" width="7" height="45" rx="3.5" fill="url(#bar-grad)" />
    <rect x="90" y="58" width="7" height="23" rx="3.5" fill="url(#bar-grad)" />
  </g>
  <!-- Sparkles -->
  <circle cx="38" cy="32" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="82" cy="28" r="1.5" fill="#38bdf8" opacity="0.9" />
