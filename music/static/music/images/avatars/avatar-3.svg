<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="vinyl-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg-grad-3)" />
  <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="2" />
  <!-- Vinyl Disc -->
  <g filter="url(#shadow-3)">
    <circle cx="60" cy="60" r="42" fill="#18181b" stroke="#27272a" stroke-width="2" />
    <!-- Grooves -->
    <circle cx="60" cy="60" r="37" fill="none" stroke="#27272a" stroke-width="1" />
    <circle cx="60" cy="60" r="32" fill="none" stroke="#3f3f46" stroke-width="0.8" opacity="0.6" />
    <circle cx="60" cy="60" r="27" fill="none" stroke="#27272a" stroke-width="1" />
    <!-- Center Label -->
    <circle cx="60" cy="60" r="16" fill="url(#vinyl-label)" />
    <!-- Center Hole -->
    <circle cx="60" cy="60" r="4" fill="#0f172a" />
    <!-- Needle tone arm silhouette -->
    <path d="M85 32 L68 52 L62 50" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="85" cy="32" r="4" fill="#38bdf8" />
  </g>
</svg>
