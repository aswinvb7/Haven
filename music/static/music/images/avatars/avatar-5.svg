<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow-5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg-grad-5)" />
  <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  <!-- Beamed Music Notes -->
  <g filter="url(#shadow-5)" fill="#ffffff">
    <!-- Beam -->
    <polygon points="44,38 78,28 78,38 44,48" />
    <!-- Stems -->
    <rect x="44" y="38" width="5" height="42" rx="2.5" />
    <rect x="73" y="28" width="5" height="44" rx="2.5" />
    <!-- Note heads -->
    <ellipse cx="38" cy="80" rx="10" ry="7" transform="rotate(-25 38 80)" />
    <ellipse cx="67" cy="72" rx="10" ry="7" transform="rotate(-25 67 72)" />
  </g>
  <!-- Accent dots -->
  <circle cx="34" cy="38" r="2.5" fill="#fde047" />
  <circle cx="86" cy="46" r="2" fill="#ffffff" opacity="0.8" />
