<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" width="32" height="32">
  <defs>
    <!-- White to Light Purple Gradient -->
    <linearGradient id="crescentMoonGradient" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- Subtle Elegant Glow -->
    <filter id="moonGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Clean, Minimal Crescent Moon Symbol -->
  <path d="M19 4C11.27 4 5 10.27 5 18s6.27 14 14 14c5.05 0 9.49-2.69 11.93-6.72-1.72.63-3.58.98-5.53.98-8.28 0-15-6.72-15-15 0-3.35 1.1-6.44 2.97-8.95C21.03 4.1 19.88 4 19 4z"
        transform="scale(0.85) translate(2.5, 1.5)"
        fill="url(#crescentMoonGradient)"
        filter="url(#moonGlowFilter)"/>
</svg>
