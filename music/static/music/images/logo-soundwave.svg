<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#logoGlow)">
    <rect x="2" y="14" width="3.5" height="8" rx="1.75" fill="url(#logoGrad)"/>
    <rect x="8" y="9" width="3.5" height="18" rx="1.75" fill="url(#logoGrad)"/>
    <rect x="14" y="3" width="3.5" height="30" rx="1.75" fill="url(#logoGrad)"/>
    <rect x="20" y="7" width="3.5" height="22" rx="1.75" fill="url(#logoGrad)"/>
    <rect x="26" y="11" width="3.5" height="14" rx="1.75" fill="url(#logoGrad)"/>
    <rect x="32" y="15" width="3.5" height="6" rx="1.75" fill="url(#logoGrad)"/>
  </g>
</svg>
