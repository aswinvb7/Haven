<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgGrad1)" />
  <circle cx="200" cy="200" r="140" fill="url(#glow1)" />
  <g filter="url(#shadow1)">
    <!-- Vinyl Disc & Waveform -->
    <circle cx="200" cy="200" r="90" fill="#0c0d18" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
    <circle cx="200" cy="200" r="65" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="8 4" />
    <circle cx="200" cy="200" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="200" cy="200" r="18" fill="#ffffff" />
    <circle cx="200" cy="200" r="6" fill="#7c3aed" />
    <!-- Soundwave lines around bottom -->
    <path d="M120 330 Q160 300 200 330 T280 330" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
    <path d="M140 345 Q170 325 200 345 T260 345" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
