<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgGrad2)" />
  <circle cx="200" cy="200" r="140" fill="url(#glow2)" />
  <g filter="url(#shadow2)">
    <!-- Modern Headphones Icon -->
    <path d="M120 220 V190 A80 80 0 0 1 280 190 V220" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <!-- Earcups -->
    <rect x="100" y="200" width="36" height="64" rx="18" fill="#ffffff" />
    <rect x="264" y="200" width="36" height="64" rx="18" fill="#ffffff" />
    <!-- Inner ear pads -->
    <rect x="122" y="210" width="10" height="44" rx="5" fill="#0284c7" />
    <rect x="268" y="210" width="10" height="44" rx="5" fill="#0284c7" />
    <!-- Sound pulse bars -->
    <line x1="160" y1="220" x2="160" y2="245" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="180" y1="205" x2="180" y2="260" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="195" x2="200" y2="270" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="220" y1="205" x2="220" y2="260" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="240" y1="220" x2="240" y2="245" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
