<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgGrad5)" />
  <circle cx="200" cy="200" r="140" fill="url(#glow5)" />
  <g filter="url(#shadow5)">
    <!-- Lo-Fi Cassette Tape -->
    <rect x="100" y="140" width="200" height="124" rx="16" fill="#0c1e15" stroke="#ffffff" stroke-width="4" />
    <rect x="130" y="165" width="140" height="74" rx="8" fill="#ffffff" />
    <!-- Tape Spools -->
    <circle cx="165" cy="202" r="18" fill="#064e3b" stroke="#ffffff" stroke-width="3" />
    <circle cx="165" cy="202" r="8" fill="#ffffff" />
    <circle cx="235" cy="202" r="18" fill="#064e3b" stroke="#ffffff" stroke-width="3" />
    <circle cx="235" cy="202" r="8" fill="#ffffff" />
    <rect x="180" y="196" width="40" height="12" rx="3" fill="#0c1e15" />
    <!-- Trapezoid bottom cutout -->
    <polygon points="140,264 260,264 246,244 154,244" fill="#059669" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
