<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgGrad6)" />
  <circle cx="200" cy="200" r="140" fill="url(#glow6)" />
  <g filter="url(#shadow6)">
    <!-- Heart / Pulse Acoustic Wave -->
    <circle cx="200" cy="200" r="85" fill="#4c0519" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" />
    <!-- Pulse Soundwave Line -->
    <path d="M135 200 L165 200 L180 160 L195 240 L210 175 L225 215 L240 200 L265 200" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Floating sound sparkles -->
    <circle cx="160" cy="140" r="4" fill="#ffffff" fill-opacity="0.8" />
    <circle cx="240" cy="140" r="6" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="250" cy="255" r="3" fill="#ffffff" fill-opacity="0.7" />
    <circle cx="150" cy="250" r="5" fill="#ffffff" fill-opacity="0.6" />
    <!-- Pulse concentric ripple -->
    <circle cx="200" cy="200" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6" />
  </g>
</svg>
