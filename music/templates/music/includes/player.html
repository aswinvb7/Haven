{% load static %}
<!-- ====================================================================
     GLOBAL BOTTOM MINI MUSIC PLAYER & FULL-SCREEN PLAYER
     Included for pages that don't have their own album/artist player
     ==================================================================== -->
<div class="mini-player" id="miniPlayer" aria-label="Music Player" role="region" style="display: none;">
    <div class="container mini-player-container">
        <!-- 1. Track Info (Artwork, Title, Artist) -->
        <div class="mini-player-track" id="miniPlayerTrack" title="Open Now Playing">
            <div class="mini-player-cover-wrap">
                <img id="miniPlayerCover" src="{% static 'music/images/album-midnight-vibes.svg' %}" alt="Track Artwork" class="mini-player-cover">
            </div>
            <div class="mini-player-meta">
                <span id="miniPlayerTitle" class="mini-player-title">Select a track</span>
                <span id="miniPlayerArtist" class="mini-player-artist">Haven Music</span>
            </div>
        </div>

        <!-- 2. Controls & Seek (Center) -->
        <div class="mini-player-center">
            <div class="mini-player-controls">
                <!-- Previous Button -->
                <button type="button" class="mini-ctrl-btn mini-btn-prev" id="miniPrevBtn" aria-label="Previous Track">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
                    </svg>
                </button>

                <!-- Play/Pause Button -->
                <button type="button" class="mini-ctrl-btn mini-btn-play" id="miniPlayBtn" aria-label="Play" title="Play">
                    <svg class="mini-icon-play icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                        <polygon points="7 4 19 12 7 20 7 4"></polygon>
                    </svg>
                    <svg class="mini-icon-pause icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display: none;">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </button>

                <!-- Next Button -->
                <button type="button" class="mini-ctrl-btn mini-btn-next" id="miniNextBtn" aria-label="Next Track">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
                    </svg>
                </button>
            </div>

            <!-- Progress / Seek Bar with Time Displays -->
            <div class="mini-player-progress-bar-wrap">
                <span class="mini-player-time" id="miniCurrentTime">0:00</span>
                <div class="mini-seek-slider-container">
                    <input type="range" class="mini-seek-slider" id="miniSeekSlider" min="0" max="100" value="0" step="0.1" aria-label="Seek track position">
                </div>
                <span class="mini-player-time" id="miniTotalTime">0:00</span>
            </div>
        </div>

        <!-- 3. Volume Control (Right) -->
        <div class="mini-player-right">
            <div class="mini-volume-wrap">
                <button type="button" class="mini-volume-btn" id="miniVolumeBtn" aria-label="Mute / Unmute">
                    <!-- Volume High -->
                    <svg class="mini-vol-icon mini-vol-high" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <!-- Volume Mute -->
                    <svg class="mini-vol-icon mini-vol-muted" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
                <div class="mini-vol-slider-container">
                    <input type="range" class="mini-volume-slider" id="miniVolumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
                </div>
            </div>

            <!-- 4. Close Player Button (×) -->
            <button type="button" class="mini-player-close-btn" id="miniCloseBtn" aria-label="Close Player" title="Close player">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- ====================================================================
     FULL-SCREEN NOW PLAYING OVERLAY
     ==================================================================== -->
<div class="fullscreen-player" id="fullscreenPlayer" aria-label="Full-Screen Music Player" role="dialog" aria-modal="true" style="display: none;">
    <!-- Ambient Backdrop Artwork Glow -->
    <div class="fs-ambient-glow" id="fsAmbientGlow"></div>
    <div class="fs-backdrop-overlay"></div>

    <div class="fs-player-inner">
        <!-- Top Header: Close Button & Context -->
        <header class="fs-header">
            <button type="button" class="fs-close-btn" id="fsCloseBtn" aria-label="Close full-screen player" title="Close full-screen player (Esc)">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="fs-header-meta">
                <span class="fs-header-subtitle">NOW PLAYING</span>
                <span class="fs-header-album-title" id="fsHeaderAlbumTitle">Haven Stream</span>
            </div>
            <div class="fs-header-spacer" aria-hidden="true"></div>
        </header>

        <!-- Main Content Area -->
        <main class="fs-body">
            <!-- Large Artwork -->
            <div class="fs-artwork-container">
                <div class="fs-artwork-card">
                    <img id="fsArtwork" src="{% static 'music/images/album-midnight-vibes.svg' %}" alt="Album Artwork" class="fs-artwork-img">
                </div>
            </div>

            <!-- Controls & Metadata Panel -->
            <div class="fs-content-panel">
                <!-- Track Info -->
                <div class="fs-track-details">
                    <div class="fs-track-text">
                        <h2 class="fs-track-title" id="fsSongTitle">Select a track</h2>
                        <p class="fs-track-artist" id="fsArtistName">Haven Music</p>
                    </div>
                </div>

                <!-- Progress / Seek Slider -->
                <div class="fs-progress-wrap">
                    <div class="fs-slider-container">
                        <input type="range" class="fs-seek-slider" id="fsSeekSlider" min="0" max="100" value="0" step="0.1" aria-label="Seek track position">
                    </div>
                    <div class="fs-time-row">
                        <span class="fs-time fs-current-time" id="fsCurrentTime">0:00</span>
                        <span class="fs-time fs-total-time" id="fsTotalTime">0:00</span>
                    </div>
                </div>

                <!-- Playback Controls (Shuffle, Prev, Play/Pause, Next, Repeat) -->
                <div class="fs-controls-wrap">
                    <!-- Shuffle Button -->
                    <button type="button" class="fs-ctrl-btn fs-btn-shuffle" id="fsShuffleBtn" aria-label="Toggle Shuffle" title="Shuffle">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                        <span class="fs-shuffle-dot" aria-hidden="true"></span>
                    </button>

                    <!-- Previous Button -->
                    <button type="button" class="fs-ctrl-btn fs-btn-prev" id="fsPrevBtn" aria-label="Previous Track" title="Previous Track">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <polygon points="19 20 9 12 19 4 19 20"></polygon>
                            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
                        </svg>
                    </button>

                    <!-- Play/Pause Button -->
                    <button type="button" class="fs-ctrl-btn fs-btn-play" id="fsPlayBtn" aria-label="Play" title="Play">
                        <svg class="fs-icon-play icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                            <polygon points="7 4 19 12 7 20 7 4"></polygon>
                        </svg>
                        <svg class="fs-icon-pause icon-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="display: none;">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>

                    <!-- Next Button -->
                    <button type="button" class="fs-ctrl-btn fs-btn-next" id="fsNextBtn" aria-label="Next Track" title="Next Track">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
                        </svg>
                    </button>

                    <!-- Repeat Button -->
                    <button type="button" class="fs-ctrl-btn fs-btn-repeat" id="fsRepeatBtn" aria-label="Toggle Repeat" title="Repeat: Off">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                        <span class="fs-repeat-badge" id="fsRepeatBadge">1</span>
                        <span class="fs-repeat-dot" aria-hidden="true"></span>
                    </button>
                </div>

                <!-- Volume Control -->
                <div class="fs-volume-wrap">
                    <button type="button" class="fs-volume-btn" id="fsVolumeBtn" aria-label="Mute / Unmute" title="Mute / Unmute">
                        <!-- Volume High -->
                        <svg class="fs-vol-icon fs-vol-high" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        <!-- Volume Mute -->
                        <svg class="fs-vol-icon fs-vol-muted" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                            <line x1="23" y1="9" x2="17" y2="15"></line>
                            <line x1="17" y1="9" x2="23" y2="15"></line>
                        </svg>
                    </button>
                    <div class="fs-volume-slider-container">
                        <input type="range" class="fs-volume-slider" id="fsVolumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Full-screen volume">
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
